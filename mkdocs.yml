site_name: ActionRef
site_description: Behavioral references and explicit trade-offs for clinical score thresholds
site_url: https://Sheldon0106.github.io/ActionRef/
repo_url: https://github.com/Sheldon0106/ActionRef
repo_name: Sheldon0106/ActionRef
edit_uri: ""
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    primary: custom
    accent: teal
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - stylesheets/extra.css
nav:
  - Overview: index.md
  - Quick start: quickstart.md
  - Data inputs: data.md
  - Methods and outputs: references.md
  - K and R guidance: R_GUIDANCE.md
  - Python API: API_REFERENCE.md
  - Study materials: paper-reproduction.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
copyright: ActionRef authors
