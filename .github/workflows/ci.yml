name: Package and documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,research]" build
      - run: python -m pytest
      - run: python examples/synthetic_walkthrough.py
      - run: python examples/reference_states.py
      - run: python examples/reproduce_paper.py
      - run: python examples/sepsis_paper_analysis.py --help
      - run: python -m build
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e . -r requirements-docs.txt
      - run: python scripts/check_publication.py
      - run: python -m mkdocs build --strict
